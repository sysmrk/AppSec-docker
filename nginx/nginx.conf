worker_processes auto;

events {
  worker_connections 1024;
}

http {
  server_tokens off;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format appsec '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time';
  access_log /var/log/nginx/access.log appsec;
  error_log /var/log/nginx/error.log warn;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  client_body_timeout 15s;
  client_header_timeout 15s;
  client_max_body_size 10m;
  reset_timedout_connection on;

  limit_req_zone $binary_remote_addr zone=appsec_api:10m rate=12r/s;
  limit_conn_zone $binary_remote_addr zone=appsec_conn:10m;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript;

  upstream appsec_api {
    server api:8080;
    keepalive 16;
  }

  server {
    listen 8080;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data:; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; worker-src 'self' blob:" always;

    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
      return 405;
    }

    location ~ /\.(?!well-known) {
      deny all;
    }

    location = /appsec-api/metrics {
      allow 127.0.0.1;
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      deny all;
      rewrite ^/appsec-api/(.*)$ /$1 break;
      proxy_pass http://appsec_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /appsec-api/ {
      limit_req zone=appsec_api burst=48 nodelay;
      limit_conn appsec_conn 40;
      rewrite ^/appsec-api/(.*)$ /$1 break;
      proxy_pass http://appsec_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_hide_header X-Powered-By;
    }

    location = / {
      return 302 /appsec-api/ui/;
    }

    location / {
      return 404;
    }
  }
}
