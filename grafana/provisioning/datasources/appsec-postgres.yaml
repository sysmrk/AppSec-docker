apiVersion: 1

datasources:
  - name: AppSec PostgreSQL
    uid: appsec-postgres
    type: postgres
    access: proxy
    isDefault: true
    url: ${POSTGRES_HOST}:${POSTGRES_PORT}
    user: ${POSTGRES_USER}
    database: ${POSTGRES_DB}
    editable: true
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
