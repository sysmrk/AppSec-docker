# V4 pilot only: public vendor snapshot supplied by the host, read-only.
services:
  worker:
    environment:
      APPSEC_V4_BACKPORT_TRIAL: ${APPSEC_V4_BACKPORT_TRIAL:-false}
      APPSEC_V4_EXTERNAL_TRIAL: ${APPSEC_V4_EXTERNAL_TRIAL:-false}
      APPSEC_V4_APK_TRIAL: ${APPSEC_V4_APK_TRIAL:-false}
      APPSEC_V4_UBUNTU_TRIAL: ${APPSEC_V4_UBUNTU_TRIAL:-false}
      APPSEC_V4_RPM_TRIAL: ${APPSEC_V4_RPM_TRIAL:-false}
    volumes:
      - ./fix-discovery-cache:/vendor-snapshots:ro
  image-worker:
    environment:
      APPSEC_V4_BACKPORT_TRIAL: ${APPSEC_V4_BACKPORT_TRIAL:-false}
      APPSEC_V4_EXTERNAL_TRIAL: ${APPSEC_V4_EXTERNAL_TRIAL:-false}
      APPSEC_V4_APK_TRIAL: ${APPSEC_V4_APK_TRIAL:-false}
      APPSEC_V4_UBUNTU_TRIAL: ${APPSEC_V4_UBUNTU_TRIAL:-false}
      APPSEC_V4_RPM_TRIAL: ${APPSEC_V4_RPM_TRIAL:-false}
    volumes:
      - ./fix-discovery-cache:/vendor-snapshots:ro
