name: tag-main-changes
on:
  push:
    branches: [main, develop/v3]

permissions:
  contents: write

concurrency:
  group: tag-main-${{ github.sha }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Annotated tag for every tracked commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          short_sha="$(git rev-parse --short=12 HEAD)"
          tag="change-${short_sha}"
          if ! git ls-remote --tags --exit-code origin "refs/tags/${tag}" >/dev/null 2>&1; then
            git tag -a "${tag}" -m "AppSec development change ${short_sha}"
            git push origin "refs/tags/${tag}"
          fi
      - name: Semantic release tag from VERSION
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f VERSION ]]; then exit 0; fi
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid VERSION: $version" >&2
            exit 1
          fi
          if git ls-remote --tags --exit-code origin "refs/tags/${version}" >/dev/null 2>&1; then
            echo "Release tag ${version} already exists"
            exit 0
          fi
          git tag -a "${version}" -m "AppSec release ${version}"
          git push origin "refs/tags/${version}"
