name: validate

on:
  push:
  pull_request:

jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: docker compose -f docker-compose.yaml config >/tmp/appsec-compose.yaml
      - name: Verify shared runtime image and separated service privileges
        run: |
          docker compose -f docker-compose.yaml --profile '*' config --format json >/tmp/appsec-compose.json
          python - <<'PY'
          import json
          s = json.load(open('/tmp/appsec-compose.json'))['services']
          names = ('api','worker','scheduler','image-worker','security-worker','appsec-runner')
          assert len({s[n]['image'] for n in names}) == 1
          assert all(s[n]['pull_policy'] == 'never' for n in names)
          assert [n for n in names if 'build' in s[n]] == ['appsec-runner']
          assert not any('/var/run/docker.sock' in str(v) for v in s['api'].get('volumes',[]))
          assert any('/var/run/docker.sock' in str(v) for v in s['worker'].get('volumes',[]))
          PY
      - name: Compile Python
        run: python -m py_compile runner/appsecctl/*.py scripts/setup-metabase.py scripts/v3-benchmark.py scripts/v4-benchmark.py scripts/v4-scanner-compare.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional MCP test dependencies
        run: python -m pip install -r integrations/mcp/requirements.txt -r runner/requirements.txt httpx
      - name: Unit tests for security and MCP contracts
        run: |
          PYTHONPATH=runner:integrations/mcp python -m unittest discover -s tests -p 'test_*.py' -v
      - name: V4 isolated nginx smoke regression
        run: |
          docker pull nginx:stable
          PYTHONPATH=runner python - <<'PY'
          from appsecctl import v4_validation as v
          a=v.smoke("nginx:stable")
          assert a["status"]=="passed",a
          b=v.smoke("nginx:stable")
          assert v.matches(a,b),(a,b)
          PY
      - name: V4 real offline native APT upgrade regression
        run: PYTHONPATH=runner python tests/integration_native_apt.py
      - name: Real BuildKit source policy regression (v0.29.0)
        run: bash tests/integration_buildkit_policy.sh
      - name: Real temporary Copa source transport and Docker exporter
        run: bash tests/integration_copa_transport.sh
      - name: Repository scanner smoke test
        run: bash tests/integration_repository_scan.sh
      - name: Compile optional MCP module
        run: python -m py_compile integrations/mcp/appsec_mcp.py
      - name: Check first-party UI JavaScript syntax
        run: |
          node --check runner/appsecctl/webui/assets/app.js
          node --check runner/appsecctl/webui/assets/workspace.js
          node tests/test_optimized_summary.js
      - name: Validate CLI syntax and executable mode
        run: |
          test -x appsec
          test "$(git ls-files -s appsec | cut -d ' ' -f 1)" = 100755
          python -m py_compile appsec
          ./appsec --help >/dev/null

  database-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: appsec
          POSTGRES_PASSWORD: ci-test-password-only
          POSTGRES_DB: appsec
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appsec -d appsec"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://appsec:ci-test-password-only@localhost:5432/appsec
      APPSEC_ADMIN_API_KEY: ci-long-admin-api-key-local-only
      APPSEC_ADMIN_PASSWORD: ci-long-password-local-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install migrations and database dependencies
        run: python -m pip install -r runner/requirements.txt sqlalchemy
      - name: Apply all migrations to real PostgreSQL
        run: python -m alembic -c alembic.ini upgrade head
      - name: Check scan-only job schema and retry migration
        run: |
          PYTHONPATH=runner python - <<'PY'
          from appsecctl import db
          with db.connect() as conn:
              db.ensure_admin_user(conn)
              job_id = db.enqueue_pipeline(conn, 'nginx:stable')
              mode = conn.execute("SELECT mode FROM pipeline_jobs WHERE id = %s", (job_id,)).fetchone()['mode']
              assert mode == 'scan', mode
              from appsecctl import ui_queries
              admin = conn.execute("SELECT id, username, role FROM users WHERE username = 'admin'").fetchone()
              data = ui_queries.overview_data(conn, dict(admin))
              assert 'pipelines' in data and 'summary' in data
              image_id = db.get_or_create_image(conn, 'nginx:stable')
              pipeline_id = db.create_pipeline(conn, image_id, 'nginx:stable')
              detail = ui_queries.pipeline_details(conn, pipeline_id)
              assert detail['pipeline']['id'] == pipeline_id or str(detail['pipeline']['id']) == pipeline_id
              db.record_service_heartbeat(conn, 'worker:image', 'ci-worker')
              health = db.service_health_summary(conn)
              assert health['database'] == 'connected'
              assert any(item['service'] == 'worker:image' for item in health['heartbeats'])
              from appsecctl import manual_workflows as mw
              user = dict(admin)
              session = mw.create(conn, 'nginx:stable', None, str(user['id']))
              assert mw.get_workflow(conn, session['id'], user)['state'] == 'queued'
              history = ui_queries.image_workflow_history(conn, user, page=1, limit=1)
              assert history['total'] >= 3 and len(history['items']) == 1
              next_page = ui_queries.image_workflow_history(conn, user, page=2, limit=1)
              assert next_page['items'][0]['id'] != history['items'][0]['id']
              all_history = ui_queries.image_workflow_history(conn, user)
              assert any(str(w['id']) == session['id'] and w['state'] == 'queued' for w in all_history['items'])
              assert len(all_history['items']) == history['total']
              # Simulate the real completed scan records; no external scanner needed for DB transitions.
              db.insert_scan_started(conn, '00000000-0000-0000-0000-000000000011', pipeline_id, image_id, 'nginx:stable', 'original')
              db.update_scan_success(conn, '00000000-0000-0000-0000-000000000011', '/reports/ci.json', {'Results': []}, {'CRITICAL': 0, 'HIGH': 0})
              db.finish_pipeline(conn, pipeline_id, 'success')
              conn.execute("UPDATE pipeline_jobs SET status='success', pipeline_id=%s WHERE id=%s", (pipeline_id, session['scan_job_id']))
              assert mw.get_workflow(conn, session['id'], user)['state'] == 'awaiting_approval'
              awaiting = next(w for w in ui_queries.image_workflow_history(conn, user)['items'] if str(w['id']) == session['id'])
              assert awaiting['bulk_eligible'] and awaiting['bulk_disabled_reason'] is None
              try:
                  mw.decide(conn, session['id'], user, 'approve_patch', True)
                  raise AssertionError('unverified original scan was approved')
              except RuntimeError as exc:
                  assert 'SCAN_EVIDENCE_INVALID' in str(exc)
              from psycopg.types.json import Jsonb
              original_image_id = 'sha256:' + 'a'*64
              raw = {'ArtifactType':'container_image','Metadata':{'ImageID':original_image_id},
                     '_appsec':{'verified':True,'image_id':original_image_id},
                     'Results':[{'Target':'nginx (debian 13)','Class':'os-pkgs',
                                 'Packages':[{'Name':'libc6','Version':'1'}],'Vulnerabilities':[]}]}
              conn.execute("UPDATE scan_runs SET raw_report=%s WHERE pipeline_id=%s AND phase='original'", (Jsonb(raw),pipeline_id))
              try:
                  mw.decide(conn, session['id'], user, 'approve_patch', True)
                  raise AssertionError('no-fix scan was approved')
              except RuntimeError as exc:
                  assert 'NO_FIXABLE_OS' in str(exc)
              raw['Results'][0]['Vulnerabilities'] = [{'VulnerabilityID':'CVE-test','PkgName':'libc6','FixedVersion':'2'}]
              conn.execute("UPDATE scan_runs SET raw_report=%s WHERE pipeline_id=%s AND phase='original'", (Jsonb(raw),pipeline_id))
              result = mw.decide(conn, session['id'], user, 'approve_patch', True)
              assert result['state'] == 'patch_queued'
              history = ui_queries.image_workflow_history(conn, user)
              workflow = next(w for w in history['items'] if str(w['id']) == session['id'])
              assert workflow['state'] == 'patch_queued' and not workflow['bulk_eligible']
              assert sum(str(w['pipeline_id']) == pipeline_id for w in history['items']) == 1
              patch = conn.execute("SELECT mode, max_attempts, pipeline_id FROM pipeline_jobs WHERE id=%s", (result['patch_job_id'],)).fetchone()
              assert patch['mode'] == 'continue_patch' and patch['max_attempts'] == 1
              assert str(patch['pipeline_id']) == pipeline_id
              try:
                  mw.decide(conn, session['id'], user, 'approve_patch', True)
                  raise AssertionError('duplicate approval was accepted')
              except RuntimeError:
                  pass
              # Real SQL inventory and registry governance checks.
              from appsecctl import inventory, registry
              rows = inventory.list_images(conn, user, search="nginx")
              assert rows["items"] and rows["items"][0]["name"] == 'nginx:stable'
              image_history = inventory.image_history(conn, user, image_id)
              assert image_history
              reg = registry.create(conn, "enterprise-harbor", "harbor.example.org:443",
                                    None, True, str(user["id"]))
              assert reg["host"] == "harbor.example.org:443"
              checks = registry.preflight(conn, "harbor.example.org:443/org/api:1", user)
              assert any(c["name"] == "Image pull" and c["status"] == "unverified" for c in checks["checks"])

              # Simulate prepared image, but do NOT perform any Docker/registry write.
              from uuid import uuid4
              patched_id = str(uuid4())
              patch_id = str(uuid4())
              source_id = '00000000-0000-0000-0000-000000000011'
              db.insert_patch_started(conn, patch_id, pipeline_id, source_id,
                                      "nginx:stable", "harbor.example.org:443/org/api:patched")
              db.update_patch_success(conn, patch_id, None)
              conn.execute("""
                  UPDATE patch_runs SET local_image_ref='local-patched:1',
                         publication_status='prepared' WHERE id=%s
              """, (patch_id,))
              db.insert_scan_started(conn, patched_id, pipeline_id, image_id, 'local-patched:1', 'patched')
              db.update_scan_success(conn, patched_id, '/reports/patched.json',
                                     {'Results': []}, {'CRITICAL': 0, 'HIGH': 0})
              db.insert_policy_result(conn, pipeline_id, patched_id, 'passed',
                                      {'max_critical': 0}, [])
              conn.execute("UPDATE pipeline_jobs SET status='success' WHERE id=%s", (result["patch_job_id"],))
              assert mw.get_workflow(conn, session["id"], user)["state"] == "awaiting_publication"
              publication = mw.decide(conn, session["id"], user, "approve_publish", True)
              assert publication["state"] == "publish_queued"
              pub = conn.execute("SELECT mode, max_attempts FROM pipeline_jobs WHERE id=%s",
                                 (publication["publish_job_id"],)).fetchone()
              assert pub["mode"] == "publish_patch" and pub["max_attempts"] == 1
              try:
                  mw.decide(conn, session["id"], user, "approve_publish", True)
                  raise AssertionError('duplicate registry publication accepted')
              except RuntimeError:
                  pass

              # Account lifecycle: disable and rotate token with revocation.
              created_id = db.create_user(conn, "ci-worker-user", "CI Worker", "operator",
                                          "ci-example-secret-api-key", "ci-example-passphrase-long")
              created = db.update_user_admin(conn, created_id, str(user["id"]), disabled=True)
              assert created["disabled"] is True
              assert db.user_by_api_key(conn, "ci-example-secret-api-key") is None

              from runpy import run_path
              charts = run_path("scripts/setup-metabase.py", run_name="appsec_chart_validation")
              for group in ("CARDS", "MANUAL_CARDS", "TREND_CARDS"):
                  for name, sql, *_ in charts[group]:
                      conn.execute("EXPLAIN " + sql)
              print('PostgreSQL migrations, guided approval, registry gate, inventory, users and Metabase SQL verified')
          PY
          python -m alembic -c alembic.ini upgrade head
