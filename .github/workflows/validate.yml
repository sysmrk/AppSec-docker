name: validate

on:
  push:
  pull_request:

jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: docker compose -f docker-compose.yaml config >/tmp/appsec-compose.yaml
      - name: Compile Python
        run: python -m py_compile runner/appsecctl/*.py scripts/setup-metabase.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional MCP test dependencies
        run: python -m pip install -r integrations/mcp/requirements.txt -r runner/requirements.txt httpx
      - name: Unit tests for security and MCP contracts
        run: |
          PYTHONPATH=runner:integrations/mcp python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile optional MCP module
        run: python -m py_compile integrations/mcp/appsec_mcp.py
      - name: Check first-party UI JavaScript syntax
        run: node --check runner/appsecctl/webui/assets/app.js
      - name: Validate CLI syntax
        run: python -m py_compile appsec

  database-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: appsec
          POSTGRES_PASSWORD: ci-test-password-only
          POSTGRES_DB: appsec
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appsec -d appsec"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://appsec:ci-test-password-only@localhost:5432/appsec
      APPSEC_ADMIN_API_KEY: ci-long-admin-api-key-local-only
      APPSEC_ADMIN_PASSWORD: ci-long-password-local-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install migrations and database dependencies
        run: python -m pip install -r runner/requirements.txt sqlalchemy
      - name: Apply all migrations to real PostgreSQL
        run: python -m alembic -c alembic.ini upgrade head
      - name: Check scan-only job schema and retry migration
        run: |
          PYTHONPATH=runner python - <<'PY'
          from appsecctl import db
          with db.connect() as conn:
              db.ensure_admin_user(conn)
              job_id = db.enqueue_pipeline(conn, 'nginx:stable')
              mode = conn.execute("SELECT mode FROM pipeline_jobs WHERE id = %s", (job_id,)).fetchone()['mode']
              assert mode == 'scan', mode
              from appsecctl import ui_queries
              admin = conn.execute("SELECT id, username, role FROM users WHERE username = 'admin'").fetchone()
              data = ui_queries.overview_data(conn, dict(admin))
              assert 'pipelines' in data and 'summary' in data
              image_id = db.get_or_create_image(conn, 'nginx:stable')
              pipeline_id = db.create_pipeline(conn, image_id, 'nginx:stable')
              detail = ui_queries.pipeline_details(conn, pipeline_id)
              assert detail['pipeline']['id'] == pipeline_id or str(detail['pipeline']['id']) == pipeline_id
              db.record_service_heartbeat(conn, 'worker:image', 'ci-worker')
              health = db.service_health_summary(conn)
              assert health['database'] == 'connected'
              assert any(item['service'] == 'worker:image' for item in health['heartbeats'])
              from appsecctl import manual_workflows as mw
              user = dict(admin)
              session = mw.create(conn, 'nginx:stable', None, str(user['id']))
              assert mw.get_workflow(conn, session['id'], user)['state'] == 'queued'
              # Simulate the real completed scan records; no external scanner needed for DB transitions.
              db.insert_scan_started(conn, '00000000-0000-0000-0000-000000000011', pipeline_id, image_id, 'nginx:stable', 'original')
              db.update_scan_success(conn, '00000000-0000-0000-0000-000000000011', '/reports/ci.json', {'Results': []}, {'CRITICAL': 0, 'HIGH': 0})
              db.finish_pipeline(conn, pipeline_id, 'success')
              conn.execute("UPDATE pipeline_jobs SET status='success', pipeline_id=%s WHERE id=%s", (pipeline_id, session['scan_job_id']))
              assert mw.get_workflow(conn, session['id'], user)['state'] == 'awaiting_approval'
              result = mw.decide(conn, session['id'], user, 'approve_patch', True)
              assert result['state'] == 'patch_queued'
              patch = conn.execute("SELECT mode, max_attempts, pipeline_id FROM pipeline_jobs WHERE id=%s", (result['patch_job_id'],)).fetchone()
              assert patch['mode'] == 'continue_patch' and patch['max_attempts'] == 1
              assert str(patch['pipeline_id']) == pipeline_id
              try:
                  mw.decide(conn, session['id'], user, 'approve_patch', True)
                  raise AssertionError('duplicate approval was accepted')
              except RuntimeError:
                  pass
              print('Postgres migrations, UI queries, heartbeats, manual approval and single-attempt patch verified')
          PY
          python -m alembic -c alembic.ini upgrade head
